name: UI Tests

# 什么时候自动跑：
on:
  push:
    branches: [main, master]      # 推代码到主分支就跑
    # 只改文档或图片时跳过。不加这个，改一个错别字也会跑满 2 分半的测试，
    # 白占额度；跳过之后这类提交在 Actions 里根本不会留下记录。
    paths-ignore:
      - "**.md"
      - "**.png"
  pull_request:
    branches: [main, master]      # 提 PR 也跑，作为合并前的门禁
    paths-ignore:
      - "**.md"
      - "**.png"
  workflow_dispatch:               # 支持在 GitHub 网页上手动点一下触发

jobs:
  test:
    name: Playwright + pytest
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # 1. 把仓库代码拉到 CI 机器上
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 装 Python，并开启 pip 缓存
      #    注意：cache: pip 要求仓库里存在 requirements.txt 或 pyproject.toml，
      #    否则 setup-python 会直接报错退出（"No file ... matched to"）。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3. 装测试依赖（从 requirements.txt 装，版本锁定、可复现）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 装浏览器内核（CI 机器是干净的，必须装）
      - name: Install Chromium
        run: python -m playwright install chromium

      # 5. 装 Allure 命令行（用来把原始结果渲染成 HTML 报告）
      #    用的是 Allure 3 的 npm 包，纯 Node 实现，不需要装 Java。
      #    最后两行把 npm 全局 bin 目录写进后续步骤的 PATH。
      #    注意用 Out-File 显式指定 utf8：PowerShell 里 >> 重定向的默认编码
      #    在 5.1 和 7 上不一样，写坏了 PATH 会出现"路径全是乱码、命令找不到"。
      - name: Install Allure CLI
        run: |
          npm install -g allure
          $prefix = (npm prefix -g).Trim()
          Write-Output "npm global prefix: $prefix"
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5.1 单独确认 allure 真的能调起来。
      #     没有这一步，PATH 配错要等到"生成报告"那一步才报错，
      #     而那时测试已经跑完了，你会误以为是报告生成逻辑有问题。
      - name: Verify Allure CLI
        run: allure --version

      # 6. 跑测试，同时产出 JUnit XML + Allure 原始结果
      #    allure-results 的具体路径写在 pytest-suite/pytest.ini 的 addopts 里，
      #    所以这里不需要再手动加 --alluredir。
      - name: Run tests
        working-directory: pytest-suite
        run: python -m pytest --junitxml=report.xml

      # 7. 生成 Allure HTML 报告
      #    if: always() —— 测试失败时更需要报告，不能用默认的"上一步成功才执行"
      - name: Generate Allure report
        if: always()
        working-directory: pytest-suite
        run: allure generate allure-results -o allure-report --clean

      # 8. 上传报告。下载解压后打开 index.html 就能看（Allure 3 的报告需要经由
      #    HTTP 访问才能加载数据，所以本地建议用 allure open 而不是双击 index.html）
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: pytest-suite/allure-report/
          if-no-files-found: ignore
          retention-days: 7

      # 9. 失败时上传截图 —— 这是整份配置里最有价值的一步
      #    CI 上跑挂了，你人不在现场，只能靠这批截图还原现场
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: pytest-suite/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      # 10. 无论成败都上传 JUnit 报告（成功记录也要留档）
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: pytest-suite/report.xml
          if-no-files-found: ignore
          retention-days: 7
